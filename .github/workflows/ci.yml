name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck backend
        run: pnpm --filter backend exec tsc --noEmit
      - name: Typecheck frontend
        run: pnpm --filter frontend exec tsc --noEmit
      - name: Format check
        run: pnpm --filter frontend exec oxfmt --check src || true
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high || true
      - name: Secret scan
        run: |
          if git grep -I -E 'GEMINI_API_KEY=AIza|BEGIN PRIVATE KEY' -- ':!.github/**' ':!.env.example'; then
            echo 'Possible secret committed' >&2
            exit 1
          fi
